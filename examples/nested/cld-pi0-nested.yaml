# Which ECAL cell size resolves the two photons of a neutral pion best, each with a reconstruction
# tuned for it? CLD's reconstruction was tuned for its 5.1 mm cells: Pandora ignores ECAL hits below
# a threshold, in MIPs, and the best threshold depends on the cells. With one threshold for all, the
# comparison favors the cells it suits. So this is a nested optimization: for each cell size, the
# inner level tunes the threshold, and the cell sizes are compared each at its best, measured
# again on events the tuning never saw (docs/evaluators.md).
#
#   k4opt problem explain examples/nested/cld-pi0-nested.yaml --trials 8
#
# says what that means, and at most what runs; then
#
#   k4opt optimize examples/nested/cld-pi0-nested.yaml \
#       --evaluator examples/evaluators/pfo_pi0.py:PfoPi0 \
#       --evaluator examples/evaluators/ecal_channels.py:EcalChannels \
#       --trials 8 --seed 42 --workers 16 --output runs/cld-pi0-nested
#   k4opt study show runs/cld-pi0-nested
#
# The trials of each inner study share one simulation and differ only in their reconstruction.
#
# Needs the Key4hep environment (ddsim, k4run, podio, $K4GEO, $CLDCONFIG).
schema_version: k4opt.problem/v1alpha1
name: cld-pi0-nested
geometry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml
parameters:
  # CLD uses 5.1 mm; from 10 mm on the particle flow almost never resolves the photons, at any
  # threshold tried (docs/evaluators.md)
  ecal_cell_size:
    title: ECAL cell size
    type: continuous
    bounds: [2.5, 10.0]
    unit: mm
    targets:
      geometry: ECal_cell_size
      evaluators:
        readout: cell_size
  # CLD uses 0.5; a key of the Parameters of CLD's Pandora processor (docs/k4run.md)
  ecal_mip_threshold:
    title: Pandora ECAL hit threshold
    type: continuous
    bounds: [0.1, 4.0]
    targets:
      reconstruction: MyDDMarlinPandora_10ns.Parameters[ECalMipThreshold]
samples:
  pi0_50gev:
    title: 50 GeV π⁰
    generation:
      executor: gun
      particle: pi0
      energy: {value: 50, unit: GeV}
      direction: {distribution: uniform, theta: [80, 100], phi: [0, 360], unit: deg}
    simulation: {executor: ddsim, events: 200, seed: 42, physics.list: FTFP_BERT}
    reconstruction:
      executor: k4run
      # CLD's reconstruction runs only from (a copy of) its own directory
      directory: $CLDCONFIG/share/CLDConfig
      options: CLDReconstruction.py
      # it takes the geometry as an argument of its own, not only through GeoSvc
      geometry: compactFile
      cms: 240
      truthTracking: true  # the photons need no pattern recognition
      seed: 42
evaluators:
  - name: pfo.pi0
    version: "1"
    stage: reconstruction
    collections: {pfos: PandoraPFOs}
    settings:
      min_energy: {value: 1, unit: GeV}
  - name: ecal.channels
    as: readout
    version: "1"
    settings: {layers: 40, radius: {value: 2150, unit: mm}, length: {value: 4420, unit: mm}}
objectives:
  - evaluator: pfo.pi0
    stage: reconstruction
    metric: pi0.resolved
    title: π⁰ photons resolved
    direction: maximize
  - evaluator: readout
    stage: geometry
    metric: ecal_barrel.channels
    title: Readout channels
    direction: minimize
optimization:
  parameters: [ecal_cell_size]
  inner:
    parameters: [ecal_mip_threshold]
    trials: 12
    objective: pi0.resolved
