# How fine must the CLD ECAL barrel cells be to tell a photon from a pi0? A 50 GeV pi0 decays
# into two photons that reach the ECAL at least about 12 mm apart: cells finer than that see
# two showers where coarser cells see one wide photon. Finer cells reject more pi0s, but every
# cell is a readout channel. The example evaluators measure both (docs/evaluators.md): the
# rejection from simulated showers, without reconstruction, and an approximate channel count.
#
#   k4opt evaluate examples/problem/cld-ecal-pi0-rejection.yaml \
#       --evaluator examples/evaluators/shower_shape.py:ShowerShape \
#       --evaluator examples/evaluators/separation.py:Separation \
#       --evaluator examples/evaluators/ecal_channels.py:EcalChannels \
#       --param ecal_cell_size=8.0 --output runs/cld-pi0-8mm
#
# or let the optimizer search the cell size, with the same three --evaluator arguments and
# --trials 30 --seed 42 --workers 8 in place of --param (docs/optimization.md).
#
# Needs the Key4hep environment (ddsim, podio, $K4GEO); about 11 minutes per sample on one core.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-pi0-rejection
environment:
  key4hep: {channel: nightly, version: "2026-10-20"}
geometry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml
parameters:
  # CLD uses 5.1 mm; at 20 mm a 50 GeV pi0 looks like one photon
  ecal_cell_size:
    type: continuous
    bounds: [2.5, 20.0]
    unit: mm
    # one value, two targets: the geometry's constant, and the cell size the readout cost
    # (the evaluator bound as readout) computes with
    targets:
      geometry: ECal_cell_size
      evaluators:
        readout: cell_size
# every sample starts from these stages and adds what differs: the particle and the seed
stages:
  generation:
    executor: gun
    energy: {value: 50, unit: GeV}
    direction: {distribution: uniform, theta: [80, 100], phi: [0, 360], unit: deg}
  simulation: {executor: ddsim, events: 500, physics.list: FTFP_BERT}
samples:
  gamma_50gev:
    generation: {particle: gamma}
    simulation: {seed: 1}
  pi0_50gev:
    generation: {particle: pi0}
    simulation: {seed: 2}
evaluators:
  - name: calo.shower_shape
    version: "1"
    stage: simulation
    samples: [gamma_50gev, pi0_50gev]
    collections: {hits: ECalBarrelCollection}
    settings:
      threshold: {value: 70, unit: keV}
      # about the Moliere radius of tungsten, and smaller than the separation of the photons
      radius: {value: 10, unit: mm}
      bins: {low: 0, high: 1, count: 1000}

  - name: calo.separation
    as: pi0_rejection
    version: "1"
    roles:
      signal: {sample: gamma_50gev, evaluator: calo.shower_shape}
      background: {sample: pi0_50gev, evaluator: calo.shower_shape}
    settings: {signal_efficiency: 0.9}

  - name: ecal.channels
    as: readout
    version: "1"
    settings: {layers: 40, radius: {value: 2150, unit: mm}, length: {value: 4420, unit: mm}}

objectives:
  - {evaluator: pi0_rejection, stage: analysis, metric: background_rejection, direction: maximize}
  - {evaluator: readout, stage: geometry, metric: ecal_barrel.channels, direction: minimize}
