# Toy photon/pi0 separation from simulated shower widths; no reconstruction or systematics.
# See docs/evaluators.md for definitions and the command to run this example.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-pi0-rejection
environment:
  key4hep: {channel: nightly, version: "2026-10-20"}
geometry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml
parameters:
  - geometry: {constant: ECal_cell_size}
    type: continuous
    bounds: [2.5, 20.0]
    unit: mm
samples:
  gamma_20gev:
    generation:
      executor: gun
      particle: gamma
      energy: {value: 20, unit: GeV}
      direction: {distribution: uniform, theta: [80, 100], phi: [0, 360], unit: deg}
    simulation: {executor: ddsim, events: 1000, seed: 1, physics.list: FTFP_BERT}
  pi0_20gev:
    generation:
      executor: gun
      particle: pi0
      energy: {value: 20, unit: GeV}
      direction: {distribution: uniform, theta: [80, 100], phi: [0, 360], unit: deg}
    simulation: {executor: ddsim, events: 1000, seed: 2, physics.list: FTFP_BERT}
evaluators:
  - name: calo.shower_shape
    version: "1"
    stage: simulation
    samples: [gamma_20gev, pi0_20gev]
    collections: {hits: ECalBarrelCollection}
    settings:
      threshold: {value: 70, unit: keV}
      bins: {low: 0, high: 200, count: 400}
  - name: calo.separation
    as: pi0_rejection
    version: "1"
    roles:
      signal: {sample: gamma_20gev, evaluator: calo.shower_shape}
      background: {sample: pi0_20gev, evaluator: calo.shower_shape}
    settings: {signal_efficiency: 0.9}
  - name: ecal.channels
    as: readout
    version: "1"
    settings: {layers: 40, radius: {value: 2150, unit: mm}, length: {value: 4420, unit: mm}}
objectives:
  - {evaluator: pi0_rejection, stage: analysis, metric: background_rejection, direction: maximize}
constraints:
  - {evaluator: readout, stage: geometry, metric: ecal_barrel.channels, max: 5.0e+7, unit: "1"}
