# Where a parameter's value can go: the same question as cld-ecal-granularity.yaml, how fine the
# CLD ECAL barrel cells should be, asked together with two other choices. Each parameter has a
# domain (type, bounds, unit) and the destinations its value is written into (sets):
#
#   ecal_cell_size  a constant of the geometry
#   range_cut       an option of the ddsim simulation (Geant4's production cut)
#   cell_threshold  a setting of the evaluator: the energy above which a cell fires
#
# Preview what a candidate sets, without simulating anything:
#
#   k4opt evaluate examples/problem/cld-ecal-bindings.yaml \
#       --evaluator examples/evaluators/calo_photon.py:CaloPhoton \
#       --param ecal_cell_size=8.0 --param range_cut=0.5 --param cell_threshold=70 --dry-run
#
# then replace --dry-run with --output runs/cld-ecal-bindings to evaluate it, or let the optimizer
# search all three (docs/optimization.md):
#
#   k4opt optimize examples/problem/cld-ecal-bindings.yaml \
#       --evaluator examples/evaluators/calo_photon.py:CaloPhoton \
#       --trials 30 --seed 42 --output runs/cld-ecal-bindings-study
#
# Needs the Key4hep environment (ddsim, podio, $K4GEO); about 5 minutes per candidate on one core.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-bindings

environment:
  key4hep:
    channel: nightly
    version: "2026-10-20"

geometry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml

parameters:
  # CLD uses 5.1 mm; 20 mm is about the width of a photon shower
  ecal_cell_size:
    type: continuous
    bounds: [2.5, 20.0]
    unit: mm
    sets:
      geometry:
        constant: ECal_cell_size
  # ddsim's default is 0.7 mm; written as --physics.rangecut=<value>*mm
  range_cut:
    type: continuous
    bounds: [0.1, 1.0]
    unit: mm
    sets:
      stage: simulation
      option: physics.rangecut
  # half the most probable energy a MIP leaves in 0.5 mm of silicon is about 70 keV; the
  # evaluator receives it in GeV, as it declares the setting. No simulation depends on it
  cell_threshold:
    type: continuous
    bounds: [30.0, 150.0]
    unit: keV
    sets:
      evaluator: calo.photon
      setting: threshold

samples:
  gamma_10gev:
    generation:
      executor: gun
      particle: gamma
      energy:
        value: 10
        unit: GeV
      direction:
        distribution: uniform
        theta: [80, 100]
        phi: [0, 360]
        unit: deg
    simulation:
      executor: ddsim
      events: 1000
      seed: 42
      physics.list: FTFP_BERT

evaluators:
  - name: calo.photon
    version: "1"
    stage: simulation
    collections:
      hits: ECalBarrelCollection
    # no threshold here: cell_threshold sets it for every candidate

objectives:
  - stage: simulation
    metric: ecal_barrel.angular_residual
    direction: minimize
  - stage: simulation
    metric: ecal_barrel.fired_cells
    direction: minimize
