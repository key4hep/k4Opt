# How fine should the CLD ECAL barrel cells be? Finer cells measure the direction of a photon
# better, but every photon fires more cells, and each cell is a readout channel. Both are
# measured on simulated 10 GeV photons by the example evaluator calo.photon (docs/evaluators.md).
#
#   k4opt evaluate examples/problem/cld-ecal-granularity.yaml \
#       --evaluator examples/evaluators/calo_photon.py:CaloPhoton \
#       --param constants.ECal_cell_size=10.0 --output runs/cld-ecal-10mm
#
# Needs the Key4hep environment (ddsim, podio, $K4GEO); about 5 minutes per candidate on one core.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-granularity

environment:
  key4hep:
    channel: nightly
    version: "2026-10-20"

geometry:
  entry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml

parameters:
  # CLD uses 5.1 mm; 20 mm is about the width of a photon shower
  - geometry:
      constant: ECal_cell_size
    type: continuous
    bounds: [2.5, 20.0]
    unit: mm

evaluation:
  events: 1000
  seed: 42

  generation:
    particle: gamma
    energy:
      value: 10
      unit: GeV
    # the middle of the barrel, where photons enter the ECAL almost head-on
    direction:
      distribution: uniform
      theta: [80, 100]
      phi: [0, 360]
      unit: deg

  backend:
    ddsim:
      args: ["--physics.list", "FTFP_BERT"]

  # who measures the simulated photons; several evaluators would share one simulation
  evaluators:
    - name: calo.photon
      version: "1"
      settings:
        collection: ECalBarrelCollection

objectives:
  - stage: simulation
    metric: ecal_barrel.angular_residual
    direction: minimize
  - stage: simulation
    metric: ecal_barrel.fired_cells
    direction: minimize
