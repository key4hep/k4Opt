schema_version: k4opt.problem/v1alpha1
name: cld-ecal-granularity

environment:
  key4hep:
    channel: nightly
    version: "2026-10-20"

geometry:
  entry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml

parameters:
  - geometry:
      constant: ECal_cell_size
    type: continuous
    bounds: [4.0, 8.0]
    unit: mm

evaluation:
  evaluator: calo.single_particle_shower
  version: "1"
  events: 1000
  seed: 42

  settings:
    readouts:
      ecal_barrel: ECalBarrelCollection

  generation:
    particle: gamma
    energy:
      value: 10
      unit: GeV
    vertex:
      value: [0, 0, 0]
      unit: mm
    direction:
      distribution: uniform
      theta: [60, 120]
      phi: [0, 360]
      unit: deg

  backend:
    ddsim:
      args: ["--physics.list", "FTFP_BERT"]

objectives:
  - stage: simulation
    metric: ecal_barrel.position_rms
    direction: minimize

constraints:
  - stage: simulation
    metric: ecal_barrel.mean_hit_cells
    max: 100
