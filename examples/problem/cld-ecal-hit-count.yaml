# SMOKE TEST of the end-to-end flow (geometry -> ddsim -> EDM4hep -> metric). It is NOT a
# validated detector-optimization study: the only metric measured so far is the mean number
# of distinct ECAL barrel cells hit per photon (calo.hit_multiplicity), and minimizing it
# alone is not a physics-performance criterion (a coarser grid always lowers it). The
# granularity study with a real objective, cld-ecal-granularity.yaml, needs an evaluator
# for ecal_barrel.position_rms that does not exist yet.
#
#   k4opt evaluate examples/problem/cld-ecal-hit-count.yaml \
#       --param constants.ECal_cell_size=6.0 --output runs/cld-ecal-6mm
#
# Needs the Key4hep environment (ddsim, podio, $K4GEO); about 2.5 s per event on one core.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-hit-count

environment:
  key4hep:
    channel: nightly
    version: "2026-10-20"

geometry:
  entry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml

parameters:
  - geometry:
      constant: ECal_cell_size
    type: continuous
    bounds: [4.0, 8.0]
    unit: mm

evaluation:
  evaluator: calo.hit_multiplicity
  version: "1"
  events: 100
  seed: 42

  settings:
    readouts:
      ecal_barrel: ECalBarrelCollection

    generator:
      particle: gamma
      energy:
        value: 10
        unit: GeV
      vertex:
        value: [0, 0, 0]
        unit: mm
      direction:
        distribution: uniform
        theta: [60, 120]
        phi: [0, 360]
        unit: deg

  backend:
    ddsim:
      args: ["--physics.list", "FTFP_BERT"]

objectives:
  # A technical observable, not a detector-performance objective (see the note above).
  - stage: simulation
    metric: ecal_barrel.mean_hit_cells
    direction: minimize
