# SMOKE TEST of the end-to-end flow (geometry -> generation -> ddsim -> EDM4hep -> metric). It
# is NOT a validated detector-optimization study: the only metric is the mean number of
# distinct ECAL barrel cells hit per photon (the example evaluator calo.hit_multiplicity), and
# minimizing it alone is not a physics-performance criterion (a coarser grid always lowers it).
#
#   k4opt evaluate examples/problem/cld-ecal-hit-count.yaml \
#       --evaluator examples/evaluators/calo_hit_multiplicity.py:CaloHitMultiplicity \
#       --param constants.ECal_cell_size=6.0 --output runs/cld-ecal-6mm
#
# Needs the Key4hep environment (ddsim, podio, $K4GEO); about 2.5 s per event on one core.
schema_version: k4opt.problem/v1alpha1
name: cld-ecal-hit-count

environment:
  key4hep:
    channel: nightly
    version: "2026-10-20"

geometry:
  entry: FCCee/CLD/compact/CLD_o2_v09/CLD_o2_v09.xml

parameters:
  - geometry:
      constant: ECal_cell_size
    type: continuous
    bounds: [4.0, 8.0]
    unit: mm

evaluation:
  evaluator: calo.hit_multiplicity
  version: "1"
  events: 100
  seed: 42

  settings:
    collection: ECalBarrelCollection

  generation:
    particle: gamma
    energy:
      value: 10
      unit: GeV
    vertex:
      value: [0, 0, 0]
      unit: mm
    direction:
      distribution: uniform
      theta: [60, 120]
      phi: [0, 360]
      unit: deg

  backend:
    ddsim:
      args: ["--physics.list", "FTFP_BERT"]

objectives:
  # A technical observable, not a detector-performance objective (see the note above).
  - stage: simulation
    metric: ecal_barrel.mean_hit_cells
    direction: minimize
