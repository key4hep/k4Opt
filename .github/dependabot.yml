version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # the dashboard's requirements are updated by their own entry below, not twice
    exclude-paths:
      - "dashboard/**"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    ignore:
      # Streamlit (1.66.1) requires watchdog<7; drop this once a release allows it
      - dependency-name: "watchdog"
        versions: [">=7"]
  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
