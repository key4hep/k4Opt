# HTTPS at k4opt-dashboard.app.cern.ch, TLS ended at the router, plain HTTP redirected.
# Reachable from the whole Internet: everything the dashboard shows is public (docs/dashboard.md).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: k4opt-dashboard
  namespace: k4opt
  labels:
    app: k4opt-dashboard
  annotations:
    # The CERN routers admit only CERN's networks unless a route says otherwise; an empty
    # whitelist admits every address
    haproxy.router.openshift.io/ip_whitelist: ""
spec:
  host: k4opt-dashboard.app.cern.ch
  to:
    kind: Service
    name: k4opt-dashboard
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
